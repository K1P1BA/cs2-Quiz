<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Квиз CS2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="quiz-container">
    <h1>Квиз CS2</h1>

    <div id="start-box">
      <p>Перевірте свої знання з Counter-Strike 2!</p>
      <p>На кожне питання дається 15 секунд.</p>
      <button onclick="startQuiz()">Розпочати грати</button>
    </div>

    <div id="quiz-box" class="hidden">
      <div id="timer">Час: <span id="time-left">15</span>с</div>
      <h2 id="question"></h2>
      <div id="answers" class="btn-grid"></div>
    </div>

    <div id="result-box" class="hidden">
      <h2>Гра завершена!</h2>
      <p id="score-text"></p>
      <button onclick="location.reload()">Пройти знову</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
